name: "Bug Report"
description: "File a bug report to help improve Offline Ofrenda Keeper."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure your bug report does not include personal family recordings, names, or photographs.
  - type: input
    id: environment
    attributes:
      label: Operating System & Environment
      description: "e.g., Windows 11 64-bit, Ubuntu 22.04, Python 3.12"
      placeholder: "e.g., Windows 11, Python 3.12.10"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Start application via `run_production.bat`
        2. Navigate to `http://127.0.0.1:8000`
        3. Fill in Step 1...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Offline & Privacy Checklist
      options:
        - label: "I confirmed this bug occurs in offline / Airplane mode."
          required: false
        - label: "I verified that no personal family data or photos are included in this report."
          required: true

