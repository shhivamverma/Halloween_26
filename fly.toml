app = "ofrenda-keeper"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/app/data"
  WHISPER_MODEL = "base"
  HF_HUB_OFFLINE = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "ofrenda_data"
  destination = "/app/data"
