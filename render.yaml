services:
  - type: web
    name: ofrenda-keeper
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: WHISPER_MODEL
        value: base
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: PORT
        value: 10000
