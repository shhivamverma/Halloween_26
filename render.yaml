services:
  - type: web
    name: ofrenda-keeper
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: WHISPER_MODEL
        value: tiny
      - key: HF_HUB_OFFLINE
        value: "0"
      - key: COQUI_TOS_AGREED
        value: "1"
      - key: TTS_HOME
        value: /app/data/tts_cache
      - key: HF_HOME
        value: /app/data/hf_home
      - key: HF_HUB_CACHE
        value: /app/data/hf_home/hub
      - key: PORT
        value: 10000
